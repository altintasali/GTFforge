  gffcompare_classify: {threads: 1, mem_mb: 8000, runtime: 60}
  support_map: {threads: 1, mem_mb: 8000, runtime: 60}
  finalize: {threads: 1, mem_mb: 16000, runtime: 120}
  te_tss: {threads: 1, mem_mb: 16000, runtime: 60}
  gffread_extract: {threads: 1, mem_mb: 8000, runtime: 60}
  validate_gtf: {threads: 1, mem_mb: 8000, runtime: 60}
