# =============================================================================
# BUILT-IN DEFAULT per-rule resources (threads / mem_mb / runtime in minutes).
# Override in input/resources.yaml. Rules not listed get 1 thread, 4000 MB,
# 60 min. mem_per_sample (where present) is added once per sample, for rules
# that hold every sample's data at once.
# =============================================================================
