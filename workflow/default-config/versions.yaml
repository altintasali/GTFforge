# =============================================================================
# BUILT-IN DEFAULT tool versions. Override in input/versions.yaml (deep-merged,
# so a partial override such as `versions: {stringtie: "2.2.3"}` is enough).
# Each is rendered into its own env under workflow/envs/generated/; pins must
# match workflow/environment.yaml (checked by .tests/check_version_sync.py).
# =============================================================================
versions:
  # 2.2.3: the version nf-core/rnaseq 3.26.0 assembles with, so BAM rows
  # and nf-core assemblies given as GTF rows come from the same StringTie.
  stringtie: "2.2.3"
  gffcompare: "0.12.6"
  gffread: "0.12.7"
  multiqc: "1.33"
