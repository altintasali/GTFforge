# =============================================================================
# Snakemake workflow profile for SLURM clusters:
#   snakemake --workflow-profile workflow/profiles/slurm
#
# Tools run from the shared conda env (workflow/environment.yaml), so no
# --sdm conda: per-rule envs would be solved on the login node before
# anything is submitted. Per-rule threads/mem_mb/runtime come from
# workflow/default-config/resources.yaml (override in input/resources.yaml).
# slurm_account/qos are the ICMM_DM group's; replace them on other clusters.
# =============================================================================
executor: slurm
jobs: 50
default-resources:
  slurm_account: "icmm_dm"
  qos: "normal"
  mem_mb: 4000
  runtime: 60
restart-times: 1
max-jobs-per-second: 1
max-status-checks-per-second: 1
latency-wait: 60
local-cores: 4
